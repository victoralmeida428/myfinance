[project]
name = "myfinance"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.3",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pluggy-sdk>=1.0.0.post73",
    "pydantic-settings>=2.16.1",
    "python-telegram-bot>=22.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myfinance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
