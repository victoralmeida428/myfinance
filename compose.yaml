services:
  api:
    build: .
    image: myfinance:latest
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/myfinance.db
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8010:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    image: myfinance:latest
    command: ["python", "bot.py"]
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/myfinance.db
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
