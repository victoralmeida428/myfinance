# Secret multi-account configuration for the Telegram bot.
#
# Copy this file to accounts.toml (git-ignored), fill in the real values and
# run `chmod 600 accounts.toml`. Credentials must stay in .env; this file only
# references the environment variable names.
#
# Each account gets its own SQLite database, its own Pluggy credentials and
# any number of Pluggy items. The database_path is resolved relative to this
# file.

[[accounts]]
id = "victor"
name = "Victor"
telegram_user_id = 111111111
database_path = "data/myfinance.db"
# Reuse the global PLUGGY_CLIENT_ID / PLUGGY_CLIENT_SECRET variables.
pluggy_client_id_env = "PLUGGY_CLIENT_ID"
pluggy_client_secret_env = "PLUGGY_CLIENT_SECRET"
# One entry per connected bank/item. connector_name is optional.
pluggy_items = [
    { item_id = "00000000-0000-0000-0000-000000000000", connector_name = "MeuPluggy" },
    { item_id = "11111111-1111-1111-1111-111111111111", connector_name = "Outro banco" },
]

[[accounts]]
id = "maria"
name = "Maria"
telegram_user_id = 222222222
database_path = "data/maria.db"
# Credentials are read from:
#   ACCOUNT_MARIA_PLUGGY_CLIENT_ID
#   ACCOUNT_MARIA_PLUGGY_CLIENT_SECRET
# To use different variable names, set:
# pluggy_client_id_env = "MARIA_PLUGGY_CLIENT_ID"
# pluggy_client_secret_env = "MARIA_PLUGGY_CLIENT_SECRET"
pluggy_items = [
    { item_id = "22222222-2222-2222-2222-222222222222", connector_name = "Banco da Maria" },
]
